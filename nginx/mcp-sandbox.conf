# Include this inside your existing TLS server block. Nothing else in your
# config needs to change.

# The bearer check needs `if` + `return` only; that combination is safe (the
# "if is evil" advice is about wrapping proxy_pass/try_files in if).
location /mcp/REPLACE_WITH_RANDOM_PATH/ {
    if ($http_authorization != "Bearer REPLACE_WITH_TOKEN") {
        return 401;
    }

    # No trailing /mcp/ here: with one, nginx rewrites the path and Starlette
    # answers 307 to /mcp, which the client follows to the wrong port.
    proxy_pass http://127.0.0.1:8000/mcp;
    proxy_http_version 1.1;

    # nginx defaults to Connection: close upstream, which kills the long-lived
    # Streamable HTTP response.
    proxy_set_header Connection "";
    # $host drops the port, so upstream generates URLs pointing at :443.
    proxy_set_header Host $http_host;

    # Without this, verification succeeds but every tool call hangs forever:
    # nginx buffers the streaming response.
    proxy_buffering off;
    proxy_cache off;
    proxy_request_buffering off;

    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Signed download links from present_file. Deliberately has NO bearer check:
# a browser following a link cannot send custom headers, so the capability
# lives in the URL itself (HMAC over path + expiry).
location /dl/ {
    # URLs here carry a bearer-equivalent signature; keep them out of logs.
    access_log off;
    add_header Referrer-Policy "no-referrer" always;

    proxy_pass http://127.0.0.1:8000/dl/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_buffering off;
    proxy_read_timeout 300s;

    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
